<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Layout Example</title>
  </head>

  <body>
    <header>
      <h1>Site Title</h1>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <article>
        <header>
          <h2>Article Title</h2>
          <p>Published: <time datetime="2026-08-01">August 1, 2026</time></p>
        </header>

        <section>
          <h3>Introduction</h3>
          <p>Your intro content goes here.</p>
        </section>

        <section>
          <h3>Main Content</h3>
          <p>Your main content goes here.</p>
        </section>

        <footer>
          <p>Written by William</p>
        </footer>
      </article>

      <aside>
        <h3>Sidebar</h3>
        <p>Related links, ads, or extra info.</p>
      </aside>
    </main>

    <footer>
      <p>&copy; 2026 Your Website</p>
    </footer>
  </body>
</html>
